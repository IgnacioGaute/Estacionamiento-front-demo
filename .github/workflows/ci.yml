# CI del frontend. Corre en cada push a main y en cada pull request.
#
# El deploy (CD) no está acá: Railway despliega main por su cuenta. Con «Wait for CI» activado en el
# servicio de Railway, espera a que este workflow termine en verde y, si falla, no despliega.
#
# next.config.ts ignora errores de tipos y de lint durante el build, así que un build verde no
# prueba nada de eso: por eso typecheck y lint son pasos propios.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      # Este repo no fija "packageManager" en package.json: la versión va acá y tiene que coincidir
      # con la que genera pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci
      - name: pnpm build
        run: pnpm build
        env:
          # El build no consulta el backend; solo necesita que estas variables existan. Las reales
          # están en Railway.
          NEXT_PUBLIC_API_URL: http://localhost:3030
          NEXT_PUBLIC_HOST_URL: http://localhost:3000
          NEXT_PUBLIC_RECEIPTS_URL: http://localhost:3001
          NEXTAUTH_SECRET: ci-build-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-tests
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
